<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="760" rx="28" fill="#F4F4F2"/>
  <style>
    .title { font: 600 34px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -1.6px; fill: #111; }
    .sub { font: 400 15px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #777; }
    .name { font: 600 15px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111; }
    .note { font: 400 12px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #858585; }
    .num { font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #999; }
  </style>

  <text x="64" y="72" class="title">Generative Loaders — round mark studies</text>
  <text x="64" y="103" class="sub">One idea per mark. No gradients. Tested large and at 24 px.</text>

  <!-- 01: interrupted ring -->
  <g transform="translate(64 156)">
    <rect width="328" height="240" rx="18" fill="#FFF"/>
    <text x="22" y="30" class="num">01</text>
    <circle cx="102" cy="112" r="58" fill="#111"/>
    <path d="M79.5 137.5A34 34 0 1 1 128.5 132" stroke="#FFF" stroke-width="8" stroke-linecap="round"/>
    <circle cx="131" cy="123" r="4" fill="#FFF"/>
    <g transform="translate(230 64)">
      <circle cx="24" cy="24" r="24" fill="#111"/>
      <path d="M14.7 34.6A14.1 14.1 0 1 1 35 32.3" stroke="#FFF" stroke-width="3.4" stroke-linecap="round"/>
      <circle cx="36" cy="28.6" r="1.8" fill="#FFF"/>
    </g>
    <text x="22" y="196" class="name">The Finish</text>
    <text x="22" y="218" class="note">Progress becomes complete.</text>
  </g>

  <!-- 02: reveal crescent -->
  <g transform="translate(436 156)">
    <rect width="328" height="240" rx="18" fill="#FFF"/>
    <text x="22" y="30" class="num">02</text>
    <circle cx="102" cy="112" r="58" fill="#111"/>
    <circle cx="102" cy="112" r="31" stroke="#FFF" stroke-width="8"/>
    <path d="M102 81A31 31 0 0 1 128.8 127.5" stroke="#111" stroke-width="10" stroke-linecap="round"/>
    <circle cx="129" cy="128" r="4" fill="#FFF"/>
    <g transform="translate(230 64)">
      <circle cx="24" cy="24" r="24" fill="#111"/>
      <circle cx="24" cy="24" r="12.8" stroke="#FFF" stroke-width="3.4"/>
      <path d="M24 11.2A12.8 12.8 0 0 1 35.1 30.4" stroke="#111" stroke-width="4.2" stroke-linecap="round"/>
      <circle cx="35.2" cy="30.5" r="1.8" fill="#FFF"/>
    </g>
    <text x="22" y="196" class="name">The Reveal</text>
    <text x="22" y="218" class="note">A result emerging from a loop.</text>
  </g>

  <!-- 03: three beats -->
  <g transform="translate(808 156)">
    <rect width="328" height="240" rx="18" fill="#FFF"/>
    <text x="22" y="30" class="num">03</text>
    <circle cx="102" cy="112" r="58" fill="#111"/>
    <circle cx="77" cy="112" r="7" fill="#FFF" fill-opacity=".35"/>
    <circle cx="102" cy="112" r="7" fill="#FFF" fill-opacity=".65"/>
    <circle cx="127" cy="112" r="7" fill="#FFF"/>
    <g transform="translate(230 64)">
      <circle cx="24" cy="24" r="24" fill="#111"/>
      <circle cx="14" cy="24" r="3" fill="#FFF" fill-opacity=".35"/>
      <circle cx="24" cy="24" r="3" fill="#FFF" fill-opacity=".65"/>
      <circle cx="34" cy="24" r="3" fill="#FFF"/>
    </g>
    <text x="22" y="196" class="name">The Sequence</text>
    <text x="22" y="218" class="note">The universal loading rhythm.</text>
  </g>

  <!-- 04: resolve -->
  <g transform="translate(64 432)">
    <rect width="328" height="240" rx="18" fill="#FFF"/>
    <text x="22" y="30" class="num">04</text>
    <circle cx="102" cy="112" r="58" fill="#111"/>
    <path d="M75 128V96M93 128V87M111 128V101M129 128V76" stroke="#FFF" stroke-width="8" stroke-linecap="round"/>
    <g transform="translate(230 64)">
      <circle cx="24" cy="24" r="24" fill="#111"/>
      <path d="M13 31V18M20.3 31V14M27.7 31V20M35 31V10" stroke="#FFF" stroke-width="3.4" stroke-linecap="round"/>
    </g>
    <text x="22" y="196" class="name">The Resolve</text>
    <text x="22" y="218" class="note">Fragments sharpen into output.</text>
  </g>

  <!-- 05: cursor aperture -->
  <g transform="translate(436 432)">
    <rect width="328" height="240" rx="18" fill="#FFF"/>
    <text x="22" y="30" class="num">05</text>
    <circle cx="102" cy="112" r="58" fill="#111"/>
    <path d="M102 78V94M102 130V146M68 112H84M120 112H136" stroke="#FFF" stroke-width="8" stroke-linecap="round"/>
    <circle cx="102" cy="112" r="8" fill="#FFF"/>
    <g transform="translate(230 64)">
      <circle cx="24" cy="24" r="24" fill="#111"/>
      <path d="M24 10V17M24 31V38M10 24H17M31 24H38" stroke="#FFF" stroke-width="3.4" stroke-linecap="round"/>
      <circle cx="24" cy="24" r="3.2" fill="#FFF"/>
    </g>
    <text x="22" y="196" class="name">The Focus</text>
    <text x="22" y="218" class="note">Loose signals converge on one point.</text>
  </g>

  <!-- 06: stream -->
  <g transform="translate(808 432)">
    <rect width="328" height="240" rx="18" fill="#FFF"/>
    <text x="22" y="30" class="num">06</text>
    <circle cx="102" cy="112" r="58" fill="#111"/>
    <path d="M73 93H115M73 112H131M73 131H104" stroke="#FFF" stroke-width="8" stroke-linecap="round"/>
    <g transform="translate(230 64)">
      <circle cx="24" cy="24" r="24" fill="#111"/>
      <path d="M12 16H29M12 24H36M12 32H25" stroke="#FFF" stroke-width="3.4" stroke-linecap="round"/>
    </g>
    <text x="22" y="196" class="name">The Stream</text>
    <text x="22" y="218" class="note">Content arriving line by line.</text>
  </g>
</svg>
